name: deployed-contract-tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_deployed_contract.py
        env:
          DEPLOYED_BASE_URL: ${{ secrets.DEPLOYED_BASE_URL }}
          DEPLOYED_API_KEY: ${{ secrets.DEPLOYED_API_KEY }}
