<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billbridge Quickstart</title>
  <style>
    :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#57606a; --line:#d0d7de; --brand:#0969da; --code:#0d1117; --codeText:#c9d1d9; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:20px 16px 40px; }
    .top, .section { background:var(--card); border:1px solid var(--line); border-radius:10px; }
    .top { padding:16px 18px; }
    h1 { margin:0; font-size:26px; }
    p { color:var(--muted); }
    .top a { text-decoration:none; color:var(--brand); font-weight:600; font-size:14px; }
    .section { margin-top:12px; padding:14px; }
    .section h2 { margin:0 0 6px; font-size:18px; }
    .code { background:var(--code); color:var(--codeText); border:1px solid #30363d; border-radius:8px; padding:12px; position:relative; }
    pre { margin:0; white-space:pre-wrap; font-size:13px; }
    .copy { position:absolute; top:8px; right:8px; font-size:12px; padding:4px 8px; border-radius:7px; border:1px solid #30363d; background:#161b22; color:#c9d1d9; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="top">
      <h1>Quickstart</h1>
      <p>Get your API key and run your first requests.</p>
      <a href="/developer">← Back to docs home</a>
    </section>

    <section class="section">
      <h2>1) Signup (Get first key)</h2>
      <div class="code"><button class="copy" data-copy="signupCmd">Copy</button><pre id="signupCmd"></pre></div>
    </section>
    <section class="section">
      <h2>2) Check balance</h2>
      <div class="code"><button class="copy" data-copy="balanceCmd">Copy</button><pre id="balanceCmd"></pre></div>
    </section>
    <section class="section">
      <h2>3) Record usage + create key</h2>
      <div class="code"><button class="copy" data-copy="usageCmd">Copy</button><pre id="usageCmd"></pre></div>
    </section>
  </div>
  <script src="/developer-assets/app.js"></script>
</body>
</html>
