<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billbridge SDK Guides</title>
  <style>
    :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#57606a; --line:#d0d7de; --brand:#0969da; --code:#0d1117; --codeText:#c9d1d9; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:20px 16px 40px; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
    h1 { margin:0; font-size:26px; }
    h2 { margin:0 0 8px; font-size:18px; }
    p { color:var(--muted); }
    .code { background:var(--code); color:var(--codeText); border:1px solid #30363d; border-radius:8px; padding:12px; position:relative; }
    pre { margin:0; white-space:pre-wrap; font-size:13px; }
    .copy { position:absolute; top:8px; right:8px; font-size:12px; padding:4px 8px; border-radius:7px; border:1px solid #30363d; background:#161b22; color:#c9d1d9; cursor:pointer; }
    a { text-decoration:none; color:var(--brand); font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="box">
      <h1>SDK Guides</h1>
      <p>Install and call Billbridge from Python or Node.</p>
      <a href="/developer">← Back to docs home</a>
    </section>
    <section class="box">
      <h2>Python + Node setup</h2>
      <div class="code"><button class="copy" data-copy="sdkCmd">Copy</button><pre id="sdkCmd"></pre></div>
    </section>
  </div>
  <script src="/developer-assets/app.js"></script>
</body>
</html>
