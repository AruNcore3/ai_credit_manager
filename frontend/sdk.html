<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billbridge SDK Guides</title>
  <style>
    :root { --bg:#f8f6ff; --panel:#ffffff; --line:#e5dbff; --text:#24133f; --muted:#6b5a96; --assistant:#f4efff; --user:#fbf9ff; --code:#2a1848; --codeText:#f3ecff; }
    * { box-sizing: border-box; } body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .layout { max-width:1200px; margin:0 auto; min-height:100vh; display:grid; grid-template-columns:280px 1fr; gap:14px; padding:14px; }
    .sidebar,.main { background:var(--panel); border:1px solid var(--line); border-radius:12px; animation:fadeIn .35s ease both; }
    .sidebar { padding:14px; } .brand{font-size:15px;font-weight:700;margin-bottom:10px;} .hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
    .menu a{display:block;text-decoration:none;color:#3b2d63;font-size:14px;padding:9px 10px;border-radius:8px;margin-bottom:6px;border:1px solid transparent;transition:all .2s ease;}
    .menu a.active{background:#eee5ff;color:#6a3dd9;border-color:#cfbbff;font-weight:600;} .menu a:hover{background:#f6f1ff;transform:translateX(2px);}
    .main{padding:16px;} .chat{max-width:860px;margin:0 auto;}
    .msg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;animation:floatUp .35s ease both;} .assistant{background:var(--assistant);} .user{background:var(--user);}
    .role{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a5ec2;margin-bottom:6px;}
    h1{margin:0 0 8px;font-size:28px;} p{margin:0;color:#3f2f69;line-height:1.5;}
    .code{margin-top:8px;background:var(--code);color:var(--codeText);border:1px solid #30363d;border-radius:8px;padding:12px;position:relative;}
    pre{margin:0;white-space:pre-wrap;font-size:13px;} .copy{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 8px;border-radius:7px;border:1px solid #cfbbff;background:#f3ecff;color:#6a3dd9;cursor:pointer;transition:all .2s ease;}
    .copy:hover{transform:translateY(-1px);background:#eadfff;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes floatUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media (max-width:940px){.layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Billbridge Assistant Docs</div>
      <div class="hint">SDK install and usage</div>
      <nav class="menu">
        <a href="/developer">Home</a>
        <a href="/developer/quickstart">Quickstart</a>
        <a href="/developer/auth">Auth & API Keys</a>
        <a class="active" href="/developer/sdk">SDK</a>
      </nav>
    </aside>
    <main class="main">
      <div class="chat">
        <div class="msg assistant"><div class="role">Assistant</div><h1>SDK Guides</h1><p>Install and integrate with Python and Node clients.</p></div>
        <div class="msg user"><div class="role">You</div><p>Show me the exact SDK commands and example usage.</p></div>
        <div class="msg assistant"><div class="role">Assistant</div><div class="code"><button class="copy" data-copy="sdkCmd">Copy</button><pre id="sdkCmd"></pre></div></div>
      </div>
    </main>
  </div>
  <script src="/developer-assets/app.js"></script>
</body>
</html>
