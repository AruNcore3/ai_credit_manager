[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "billbridge-ai-credit-sdk"
version = "1.0.1"
description = "Official Python SDK for the Billbridge AI Credit Billing API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]
license = "MIT"
authors = [
  { name = "Billbridge", email = "support@billbridge.in" }
]
keywords = ["billbridge", "billing", "credits", "api", "sdk", "saas"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://api.billbridge.in/docs"
Documentation = "https://api.billbridge.in/reference"
Repository = "https://github.com/AruNcore3/ai_credit_manager.git"
Issues = "https://github.com/AruNcore3/ai_credit_manager/issues"
